name: Publish Python package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match package version'
          PYCODE
      - run: python -m pip install '.[test]' twine
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check installed wheel outside source tree
        run: |
          python -m venv /tmp/wc-wheel
          /tmp/wc-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wc-wheel/bin/worldcompute-quickstart --help
          /tmp/wc-wheel/bin/python -c 'from worldcompute import WorldCompute, RobotSession'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/worldcompute
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
