[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"
[project]
name = "worldcompute"
version = "0.1.0a2"
description = "Python client for World Compute controls"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "World Compute", email = "team@worldcompute.org"}]
dependencies = ["httpx>=0.27,<1", "livekit>=1.0,<2"]
[project.scripts]
worldcompute = "worldcompute.cli:main"
worldcompute-molmo = "worldcompute.molmo:main"
worldcompute-harness = "worldcompute.harness:main"
worldcompute-quickstart = "worldcompute.quickstart:run"

[project.optional-dependencies]
molmo = ["dreamscale==0.1.0a299", "numpy", "Pillow"]
sim = ["playwright>=1.50,<2", "Pillow"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1,<2"]
[project.urls]
Documentation = "https://worldcompute.org/docs/controls"
Repository = "https://github.com/worldcompute001/worldcompute-python"
[tool.pytest.ini_options]
asyncio_mode = "auto"
